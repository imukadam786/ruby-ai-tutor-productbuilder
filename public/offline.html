<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ruby — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #B7182E 0%, #7c0f1e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      padding: 24px;
      text-align: center;
    }
    .icon { font-size: 64px; margin-bottom: 24px; }
    h1 { font-size: 26px; font-weight: 800; margin-bottom: 10px; }
    p { font-size: 15px; color: rgba(255,255,255,0.75); line-height: 1.6; max-width: 300px; margin-bottom: 32px; }
    button {
      background: white;
      color: #B7182E;
      border: none;
      padding: 14px 32px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="icon">💎</div>
  <h1>You're offline</h1>
  <p>Ruby needs a connection to generate new questions. Your progress is saved — come back when you're connected.</p>
  <button onclick="window.location.reload()">Try again</button>
</body>
</html>
